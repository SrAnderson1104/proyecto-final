<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de películas</title>
    <link rel="icon" href="/favicon.ico">

    <!-- Bootstrap desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Nuestros estilos -->
    <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body>

    <!-- Barra superior -->
    <nav class="navbar navbar-dark barra-superior">
        <div class="container">
            <a class="navbar-brand" href="/">🎬 Buscador de películas</a>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Formulario de búsqueda -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="h4 card-title mb-3">Buscar película</h1>
                <p class="text-muted small">Escribe un título y, si quieres, filtra por año.</p>

                <form id="formulario-busqueda" class="row g-2">
                    <div class="col-md-7">
                        <input type="text" id="campo-titulo" class="form-control"
                               placeholder="Título (por ejemplo: Matrix)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="campo-anio" class="form-control"
                               placeholder="Año (opcional)" maxlength="4">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary">🔍 Buscar</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Mensajes de error o aviso -->
        <div id="mensaje" class="alert d-none" role="alert"></div>

        <!-- Lista de resultados (la rellena JavaScript) -->
        <section id="resultados" class="row g-3"></section>

    </main>

    <!-- Nuestro JavaScript -->
    <script src="/static/js/comun.js"></script>
    <script src="/static/js/busqueda.js"></script>
</body>
</html>
